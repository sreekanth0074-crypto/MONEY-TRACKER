<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDKs for Google Login -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="dark-theme theme-neon-green">
  <div class="app-container">
    <header>
      <div class="logo-container">
        <span class="rupee-glow">₹</span>
        <h1>MONEY TRACKER</h1>
      </div>
      <button id="settings-btn" class="icon-btn">⚙</button>
    </header>

    <main style="display: flex; flex-direction: column; height: 100%; min-height: 0;">
      <!-- Dashboard Grid with ECG Graph -->
      <div class="dashboard-grid">
        <div class="balance-card">
          <span id="lbl-balance">Balance</span>
          <h2 id="balance-amount">₹0.00</h2>
          <div class="summary-box">
            <div><span id="lbl-income">Income</span>: <span id="total-income" style="color:#00ff87;">₹0.00</span></div>
            <div><span id="lbl-expense">Expense</span>: <span id="total-expense" style="color:#ff4757;">₹0.00</span></div>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>

      <!-- Form Inputs: Category Top, Description Optional -->
      <form id="tracker-form">
        <input type="hidden" id="edit-index" value="-1">
        
        <div class="input-row">
          <select id="category" required>
            <option value="" disabled selected id="opt-select-cat">Select Category</option>
            <option value="Food">Food</option>
            <option value="Cigarette">Cigarette</option>
            <option value="Travel">Travel</option>
            <option value="Salary">Salary</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Others">Others</option>
          </select>

          <select id="type">
            <option value="expense" id="opt-expense">Expense</option>
            <option value="income" id="opt-income">Income</option>
          </select>
        </div>

        <div class="input-row">
          <input type="text" id="desc" placeholder="Description (Optional)">
          <input type="number" id="amount" placeholder="Amount" step="any" required>
        </div>
        
        <button type="submit" id="save-btn" class="glow-btn">SAVE ENTRY</button>
      </form>

      <!-- History -->
      <section class="history-section">
        <div class="history-header">
          <h3 id="lbl-history">History</h3>
          <button id="export-btn" class="export-btn">Export CSV</button>
        </div>
        <ul id="history-list"></ul>
      </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="close-settings" class="icon-btn">✖</button>
        </div>

        <!-- Google Account Section -->
        <div class="setting-group auth-group">
          <label id="lbl-account-setting">Account / അക്കൗണ്ട്</label>
          <div id="user-profile" class="user-profile hidden">
            <img id="user-photo" src="" alt="Profile">
            <span id="user-name">User</span>
            <button id="google-logout-btn" class="auth-btn logout">Sign Out</button>
          </div>
          <button id="google-login-btn" class="auth-btn google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
          </button>
        </div>

        <!-- Language Selector -->
        <div class="setting-group">
          <label id="lbl-language-setting">Language / ഭാഷ</label>
          <div class="toggle-container">
            <button id="lang-en-btn" type="button" class="mode-btn active">English</button>
            <button id="lang-ml-btn" type="button" class="mode-btn">മലയാളം</button>
          </div>
        </div>

        <div class="setting-group">
          <label id="lbl-mode-setting">Mode</label>
          <div class="toggle-container">
            <button id="dark-mode-btn" type="button" class="mode-btn active">Dark Mode</button>
            <button id="light-mode-btn" type="button" class="mode-btn">Light Mode</button>
          </div>
        </div>

        <div class="setting-group">
          <label id="lbl-accent-setting">Neon Accent Color</label>
          <div class="color-options">
            <button type="button" class="color-btn green" data-color="theme-neon-green"></button>
            <button type="button" class="color-btn cyan" data-color="theme-neon-cyan"></button>
            <button type="button" class="color-btn pink" data-color="theme-neon-pink"></button>
            <button type="button" class="color-btn yellow" data-color="theme-neon-yellow"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
